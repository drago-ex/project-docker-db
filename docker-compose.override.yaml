# docker service
services:

  # the PHP runtime with mysqli (docker/Dockerfile-db), only built as the base of the server image
  php-db:
    build:
      context: docker
      dockerfile: Dockerfile-db
      additional_contexts:
        php: service:php
    profiles: [build]

  # php server update
  server:
    build:
      additional_contexts:
        php: service:php-db


  # database
  db:
    image: library/mariadb:12.3
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: super
      MYSQL_PASSWORD: pass
    # a Docker volume, much faster than a directory of the project on Windows (WSL2)
    volumes:
      - db-data:/var/lib/mysql
    # only on this computer; DB_PORT=6033 publishes it on every interface (Docker bypasses ufw)
    ports:
      - "${DB_PORT:-127.0.0.1:6033}:3306"


volumes:
  db-data:
